name: Deploy to Kubernetes

on:
  push:
    branches: [ "main_v2" ]
  pull_request:
    branches: [ "main_v2" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    # Docker Build and Push
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract docker metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ghcr.io/hardikhari96/kubectl/haripatel-dev-v2
        tags: |
          type=ref,event=branch
          type=sha
        labels: |
          org.opencontainers.image.source=${{ github.repository }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # Kubernetes Deployment
    - name: Configure KUBECONFIG
      run: |
        echo "KUBECONFIG=${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        kubectl config view

    - name: Deploy to Kubernetes
      uses: k8s-kubelogin/k8s-deploy@v1
      with:
        context: ${{ secrets.K8S_CONTEXT }}
        namespace: default
        manifests: |
          deployment.yaml
        images: |
          ghcr.io/hardikhari96/kubectl/haripatel-dev-v2:${{ github.sha }}
        version: ${{ github.sha }}
        image-pull-secrets: |
          github-packages-secret
        kubeconfig: ${{ secrets.KUBECONFIG }}
